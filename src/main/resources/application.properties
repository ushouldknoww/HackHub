spring.application.name=hackhub
spring.profiles.default=local
server.port=${PORT:8080}

# Local development uses a disposable H2 database. Use the postgres profile for persistent data.
spring.datasource.url=${DB_URL:jdbc:h2:mem:hackhubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.flyway.enabled=false

# Never use the fallback JWT key outside local development.
hackhub.jwt.secret=${JWT_SECRET:local-dev-only-change-this-secret-before-deployment-2026}
hackhub.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
hackhub.staff-registration-key=${HACKHUB_STAFF_REGISTRATION_KEY:}
hackhub.notifications.from=${HACKHUB_MAIL_FROM:}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=HackHub
info.app.description=Hackathon management platform
info.app.version=1.0.0

logging.level.it.unicam.hackhub=INFO

spring.data.web.pageable.max-page-size=100
