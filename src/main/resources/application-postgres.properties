spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hackhub}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:hackhub}
spring.datasource.password=${DB_PASSWORD:hackhub-local-password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.h2.console.enabled=false

# The postgres profile requires an externally supplied strong secret.
hackhub.jwt.secret=${JWT_SECRET}
